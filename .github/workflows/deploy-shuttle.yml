name: Deploy to Shuttle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy oxllm-shuttle to Shuttle
        uses: shuttle-hq/deploy-action@e1c2ff9b0d68adb0b2cfb35e29edfb335b854e41
        with:
          shuttle-api-key: ${{ secrets.SHUTTLE_API_KEY }}
          project-id: ${{ vars.SHUTTLE_PROJECT_ID }}
          working-directory: crates/oxllm-shuttle
          secrets: |
            OXLLM_CONFIG_TOML = '${{ secrets.OXLLM_CONFIG_TOML }}'
